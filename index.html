<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoliBook</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f4efe6;
      --bg-secondary: #ffffff;
      --text-color: #2c221e;
      --accent-color: #8b5a2b;
      --accent-hover: #6d441f;
      --border-color: #e2d7c5;
      --card-bg: #fffcf7;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg-primary: #1a1614;
      --bg-secondary: #241e1b;
      --text-color: #ece3db;
      --accent-color: #d4a373;
      --accent-hover: #faedcd;
      --border-color: #3d332e;
      --card-bg: #2d2522;
      --shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background-color: var(--bg-primary); color: var(--text-color); min-height: 100vh; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
    h1 { font-family: Georgia, serif; color: var(--accent-color); }
    
    .theme-toggle { background: none; border: 2px solid var(--border-color); color: var(--text-color); padding: 8px 15px; border-radius: 20px; cursor: pointer; }
    
    .stats-panel { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
    .stat-card { background: var(--bg-secondary); padding: 15px; border-radius: 8px; flex: 1; min-width: 150px; text-align: center; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
    .stat-number { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }

    .main-content { display: grid; grid-template-columns: 300px 1fr; gap: 25px; }
    @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }

    .form-container { background: var(--bg-secondary); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); height: fit-content; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); }
    button.btn-submit { width: 100%; background: var(--accent-color); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button.btn-submit:hover { background: var(--accent-hover); }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 20px; border: none; background: var(--bg-secondary); color: var(--text-color); border-radius: 6px; cursor: pointer; border: 1px solid var(--border-color); }
    .tab-btn.active { background: var(--accent-color); color: white; }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    
    .book-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
    .book-cover { height: 220px; object-fit: cover; width: 100%; background: #e0e0e0; }
    .book-info { padding: 15px; flex: 1; display: flex; flex-direction: column; }
    .book-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
    .book-author { font-size: 0.9rem; opacity: 0.8; margin-bottom: 10px; }
    .stars { color: #f39c12; margin-bottom: 10px; }
    .book-notes { font-size: 0.85rem; opacity: 0.9; margin-bottom: 15px; flex: 1; font-style: italic; }
    
    .card-actions { display: flex; gap: 5px; justify-content: flex-end; }
    .btn-action { background: none; border: none; color: var(--text-color); cursor: pointer; padding: 5px; opacity: 0.7; }
    .btn-action:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-book-open"></i> PoliBook</h1>
      <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i> Modo Escuro</button>
    </header>

    <div class="stats-panel">
      <div class="stat-card">
        <div class="stat-number" id="totalRead">0</div>
        <div>Livros Lidos</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalWant">0</div>
        <div>Quero Ler</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalBought">0</div>
        <div>Meus Livros</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="avgRating">0.0</div>
        <div>Média de Notas</div>
      </div>
    </div>

    <div class="main-content">
      <div class="form-container">
        <h3>Adicionar Livro</h3>
        <br>
        <form id="bookForm">
          <div class="form-group">
            <label>Título *</label>
            <input type="text" id="title" required>
          </div>
          <div class="form-group">
            <label>Autor *</label>
            <input type="text" id="author" required>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="read">Já Li</option>
              <option value="want">Quero Ler</option>
              <option value="bought">Meus Livros (Comprados)</option>
            </select>
          </div>
          <div class="form-group" id="ratingGroup">
            <label>Nota (1 a 5)</label>
            <select id="rating">
              <option value="5">5 ★★★★★</option>
              <option value="4">4 ★★★★☆</option>
              <option value="3">3 ★★★☆☆</option>
              <option value="2">2 ★★☆☆☆</option>
              <option value="1">1 ★☆☆☆☆</option>
            </select>
          </div>
          <div class="form
